[project]
name = "pdf-ocr-worker"
version = "0.1.0"
description = "Torch worker for pdf_ocr.py: runs the MiniCPM-OCR-1.0 Reader (see docs/adr/0001)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",       # the MiniCPM and Jev image/video processors import it
    "transformers>=5.21,<5.23",  # native minicpm_ocr (and, for the Judge, Qwen3_5ForSequenceClassification)
    "pillow==12.3.0",            # also what the official Judge renderer pins
]

[tool.uv]
package = false
