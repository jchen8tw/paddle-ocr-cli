[project]
name = "paddle-ocr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docx>=0.2.4",
    "opencc-python-reimplemented>=0.1.7",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle-gpu==3.3.1",
]

[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: slow end-to-end test that needs the GPU, the models and a sample PDF (PDF_OCR_SAMPLE_PDF)",
]
